<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article — HardHat</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="hazbar"></div>
<div id="nav"></div>

<section>
  <div class="wrap article" id="art">
    <p style="color:var(--muted)">Loading…</p>
  </div>
</section>

<section class="alt">
  <div class="wrap center">
    <h2 class="sec" style="max-width:22ch">Ready to get started?</h2>
    <p class="lead">Take the 2-minute Rig-Ready assessment and get your personalized path in.</p>
    <div class="cta-row"><a class="btn btn-hi btn-lg" href="start.html">Get my Rig-Ready plan →</a><a class="btn btn-out btn-lg" href="blog.html">More articles</a></div>
  </div>
</section>

<div id="foot"></div>
<script src="app.js"></script>
<script>
HH.mountChrome('blog.html');
var slug=new URLSearchParams(location.search).get('slug');
var p=HH.blogPost(slug);
var el=document.getElementById('art');
if(!p){ el.innerHTML='<h1>Article not found</h1><p><a href="blog.html" style="color:var(--hi)">Back to the blog →</a></p>'; }
else {
  document.title=p.title+' — HardHat';
  var body=p.body.map(function(block){
    if(block==='CTA') return '<div class="notice" style="margin:22px 0"><b>Your move:</b> <a href="start.html" style="color:var(--hi)">Take the free Rig-Ready assessment →</a> to see the roles you already qualify for and your exact ticket roadmap.</div>';
    if(block.indexOf('LIST:')===0){ var items=block.slice(5).split('|'); return '<ul>'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>'; }
    return '<p>'+block+'</p>';
  }).join('');
  el.innerHTML='<a href="blog.html" style="color:var(--muted);font-size:13px">← Blog</a>'+
    '<div class="bt" style="display:flex;gap:8px;align-items:center;font-family:\'JetBrains Mono\',monospace;font-size:12px;color:var(--faint);margin-top:16px"><span class="tg" style="color:var(--hi);border:1px solid #3a3400;background:var(--hi-soft);padding:2px 8px;border-radius:5px">'+p.tag+'</span> '+p.date+' · '+p.read+'</div>'+
    '<h1>'+p.title+'</h1>'+body;
}
</script>
</body>
</html>
